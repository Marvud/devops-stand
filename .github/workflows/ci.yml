name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd app
        pip install -r requirements.txt
        
    - name: Build Docker image
      run: |
        docker build -t my-flask-app ./app
        
    - name: Run tests
      run: |
        echo "Здесь будут тесты"
        docker run my-flask-app python -c "print('Test passed!')"
        
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Push to Docker Hub
      run: |
        docker tag my-flask-app ${{ secrets.DOCKERHUB_USERNAME }}/my-flask-app:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-flask-app:latest
